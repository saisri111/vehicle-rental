
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-rental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-rental
  template:
    metadata:
      labels:
        app: vehicle-rental
    spec:
      containers:
        - name: vehicle-rental
          image: saisri12/vehicle-rental:1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
